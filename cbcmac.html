<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Raw CBC-MAC Simulator</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --active: #f59e0b;
      --done: #10b981;
      --border: #334155;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { margin: 0 0 8px 0; font-size: 1.6rem; color: var(--accent); }
    p.sub { margin: 0 0 20px 0; color: var(--muted); font-size: 0.95rem; }
    .controls {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 16px 24px;
      border-radius: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: center;
      max-width: 900px;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 20px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .input-group label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .input-group input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 6px;
      font-family: monospace;
      width: 90px;
      text-align: center;
      font-size: 1rem;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }
    button {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button.secondary {
      background: var(--border);
      color: var(--text);
    }
    .status-box {
      background: var(--panel);
      border-left: 4px solid var(--active);
      padding: 16px 20px;
      border-radius: 8px;
      max-width: 900px;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 20px;
      min-height: 72px;
    }
    .status-title {
      font-weight: 700;
      color: var(--active);
      margin-bottom: 6px;
      font-size: 1.05rem;
    }
    .status-desc {
      font-family: monospace;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .graph-container {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      max-width: 900px;
      width: 100%;
      box-sizing: border-box;
      overflow-x: auto;
    }
    svg {
      width: 100%;
      height: auto;
      min-width: 750px;
    }
    .node-box {
      fill: #0f172a;
      stroke: var(--border);
      stroke-width: 2;
      transition: all 0.3s ease;
    }
    .node-circle {
      fill: #0f172a;
      stroke: var(--border);
      stroke-width: 2;
      transition: all 0.3s ease;
    }
    .wire {
      fill: none;
      stroke: var(--border);
      stroke-width: 2.5;
      transition: all 0.3s ease;
    }
    .active-elem {
      stroke: var(--active) !important;
      stroke-width: 3.5px !important;
      filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.5));
    }
    .done-elem {
      stroke: var(--done) !important;
    }
    .svg-text {
      fill: var(--text);
      font-family: monospace;
      font-size: 13px;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .svg-label {
      fill: var(--muted);
      font-family: sans-serif;
      font-size: 12px;
      font-weight: bold;
      text-anchor: middle;
    }
  </style>
</head>
<body>

  <h1>Interactive Raw CBC-MAC Graph</h1>
  <p class="sub">Modify the 8-bit Hex blocks below and click "Next Step" to trace the data flow.</p>

  <div class="controls">
    <div class="input-group">
      <label>Block M₁ (Hex)</label>
      <input type="text" id="m1" value="4A" maxlength="2">
    </div>
    <div class="input-group">
      <label>Block M₂ (Hex)</label>
      <input type="text" id="m2" value="F2" maxlength="2">
    </div>
    <div class="input-group">
      <label>Block M₃ (Hex)</label>
      <input type="text" id="m3" value="19" maxlength="2">
    </div>
    <div class="input-group">
      <label>Secret Key K</label>
      <input type="text" id="key" value="A5" maxlength="2">
    </div>
    <div class="btn-group">
      <button class="secondary" onclick="prevStep()">◀ Prev</button>
      <button onclick="nextStep()">Next Step ▶</button>
      <button class="secondary" onclick="resetSim()">Reset</button>
    </div>
  </div>

  <div class="status-box">
    <div class="status-title" id="step-title">Step 0: Ready</div>
    <div class="status-desc" id="step-desc">Click "Next Step" to begin stepping through the Raw CBC-MAC calculation.</div>
  </div>

  <div class="graph-container">
    <svg viewBox="0 0 820 340">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
        </marker>
      </defs>

      <!-- WIRES -->
      <!-- IV to XOR1 -->
      <line id="w-iv" class="wire" x1="70" y1="120" x2="142" y2="120" marker-end="url(#arrow)"/>
      
      <!-- Block 1 Wires -->
      <line id="w-m1" class="wire" x1="165" y1="60" x2="165" y2="95" marker-end="url(#arrow)"/>
      <line id="w-x1-e1" class="wire" x1="165" y1="140" x2="165" y2="185" marker-end="url(#arrow)"/>
      <line id="w-k1" class="wire" x1="105" y1="215" x2="120" y2="215" marker-end="url(#arrow)"/>
      <polyline id="w-c1" class="wire" points="165,245 165,285 260,285 260,120 332,120" marker-end="url(#arrow)"/>

      <!-- Block 2 Wires -->
      <line id="w-m2" class="wire" x1="355" y1="60" x2="355" y2="95" marker-end="url(#arrow)"/>
      <line id="w-x2-e2" class="wire" x1="355" y1="140" x2="355" y2="185" marker-end="url(#arrow)"/>
      <line id="w-k2" class="wire" x1="295" y1="215" x2="310" y2="215" marker-end="url(#arrow)"/>
      <polyline id="w-c2" class="wire" points="355,245 355,285 450,285 450,120 522,120" marker-end="url(#arrow)"/>

      <!-- Block 3 Wires -->
      <line id="w-m3" class="wire" x1="545" y1="60" x2="545" y2="95" marker-end="url(#arrow)"/>
      <line id="w-x3-e3" class="wire" x1="545" y1="140" x2="545" y2="185" marker-end="url(#arrow)"/>
      <line id="w-k3" class="wire" x1="485" y1="215" x2="500" y2="215" marker-end="url(#arrow)"/>
      <line id="w-tag" class="wire" x1="585" y1="215" x2="670" y2="215" marker-end="url(#arrow)"/>

      <!-- NODES: IV -->
      <rect id="n-iv" class="node-box" x="15" y="100" width="55" height="40" rx="6"/>
      <text class="svg-label" x="42" y="90">IV (C₀)</text>
      <text class="svg-text" x="42" y="122">0x00</text>

      <!-- NODES: BLOCK 1 -->
      <rect id="n-m1" class="node-box" x="125" y="20" width="80" height="40" rx="6"/>
      <text class="svg-label" x="165" y="10">Message M₁</text>
      <text id="t-m1" class="svg-text" x="165" y="42">0x4A</text>

      <circle id="n-x1" class="node-circle" cx="165" cy="120" r="20"/>
      <text class="svg-text" x="165" y="121">⊕</text>
      <text id="t-x1" class="svg-label" x="210" y="155"></text>

      <rect id="n-e1" class="node-box" x="125" y="190" width="80" height="55" rx="8"/>
      <text class="svg-text" x="165" y="210">Encrypt</text>
      <text class="svg-label" x="165" y="230">E_K(X₁)</text>
      <text class="svg-label" x="85" y="215">Key K</text>
      <text id="t-c1" class="svg-label" x="212" y="302">C₁: --</text>

      <!-- NODES: BLOCK 2 -->
      <rect id="n-m2" class="node-box" x="315" y="20" width="80" height="40" rx="6"/>
      <text class="svg-label" x="355" y="10">Message M₂</text>
      <text id="t-m2" class="svg-text" x="355" y="42">0xF2</text>

      <circle id="n-x2" class="node-circle" cx="355" cy="120" r="20"/>
      <text class="svg-text" x="355" y="121">⊕</text>
      <text id="t-x2" class="svg-label" x="400" y="155"></text>

      <rect id="n-e2" class="node-box" x="315" y="190" width="80" height="55" rx="8"/>
      <text class="svg-text" x="355" y="210">Encrypt</text>
      <text class="svg-label" x="355" y="230">E_K(X₂)</text>
      <text class="svg-label" x="275" y="215">Key K</text>
      <text id="t-c2" class="svg-label" x="402" y="302">C₂: --</text>

      <!-- NODES: BLOCK 3 -->
      <rect id="n-m3" class="node-box" x="505" y="20" width="80" height="40" rx="6"/>
      <text class="svg-label" x="545" y="10">Message M₃</text>
      <text id="t-m3" class="svg-text" x="545" y="42">0x19</text>

      <circle id="n-x3" class="node-circle" cx="545" cy="120" r="20"/>
      <text class="svg-text" x="545" y="121">⊕</text>
      <text id="t-x3" class="svg-label" x="590" y="155"></text>

      <rect id="n-e3" class="node-box" x="505" y="190" width="80" height="55" rx="8"/>
      <text class="svg-text" x="545" y="210">Encrypt</text>
      <text class="svg-label" x="545" y="230">E_K(X₃)</text>
      <text class="svg-label" x="465" y="215">Key K</text>

      <!-- NODES: FINAL TAG -->
      <rect id="n-tag" class="node-box" x="675" y="190" width="110" height="55" rx="8"/>
      <text class="svg-label" x="730" y="180">Final MAC Tag</text>
      <text id="t-tag" class="svg-text" x="730" y="218" style="font-weight:bold; font-size:16px;">--</text>
    </svg>
  </div>

  <script>
    let currentStep = 0;
    const totalSteps = 7;

    // Toy 8-bit non-linear permutation cipher for visual demonstration
    function toyBlockCipher(val, key) {
      let x = (val ^ key) & 0xFF;
      // Rotate left by 3 bits and add a constant, then XOR key again
      x = (((x << 3) | (x >> 5)) & 0xFF);
      x = ((x + 0x3D) & 0xFF) ^ key;
      return x & 0xFF;
    }

    function toHex(num) {
      return '0x' + num.toString(16).toUpperCase().padStart(2, '0');
    }

    function toBin(num) {
      return num.toString(2).padStart(8, '0');
    }

    function parseHexInput(id, fallback) {
      const val = parseInt(document.getElementById(id).value, 16);
      return isNaN(val) ? fallback : (val & 0xFF);
    }

    function updateSimulation() {
      const m1 = parseHexInput('m1', 0x4A);
      const m2 = parseHexInput('m2', 0xF2);
      const m3 = parseHexInput('m3', 0x19);
      const key = parseHexInput('key', 0xA5);

      // Compute cryptographic values
      const x1 = m1 ^ 0x00;
      const c1 = toyBlockCipher(x1, key);
      const x2 = m2 ^ c1;
      const c2 = toyBlockCipher(x2, key);
      const x3 = m3 ^ c2;
      const c3 = toyBlockCipher(x3, key);

      // Update static labels
      document.getElementById('t-m1').textContent = toHex(m1);
      document.getElementById('t-m2').textContent = toHex(m2);
      document.getElementById('t-m3').textContent = toHex(m3);

      // Clear all highlights
      document.querySelectorAll('.node-box, .node-circle, .wire').forEach(el => {
        el.classList.remove('active-elem', 'done-elem');
      });

      // Reset dynamic labels
      document.getElementById('t-x1').textContent = currentStep >= 1 ? toHex(x1) : '';
      document.getElementById('t-c1').textContent = currentStep >= 2 ? 'C₁: ' + toHex(c1) : 'C₁: --';
      document.getElementById('t-x2').textContent = currentStep >= 3 ? toHex(x2) : '';
      document.getElementById('t-c2').textContent = currentStep >= 4 ? 'C₂: ' + toHex(c2) : 'C₂: --';
      document.getElementById('t-x3').textContent = currentStep >= 5 ? toHex(x3) : '';
      document.getElementById('t-tag').textContent = currentStep >= 6 ? toHex(c3) : '--';

      const stepsInfo = [
        {
          title: "Step 0: Initialization (IV = 0)",
          desc: `Raw CBC-MAC initializes with a fixed zero vector (C₀ = 0x00). Message blocks are M₁=${toHex(m1)}, M₂=${toHex(m2)}, M₃=${toHex(m3)} and secret key K=${toHex(key)}.`,
          active: ['n-iv', 'n-m1', 'n-m2', 'n-m3'],
          done: []
        },
        {
          title: "Step 1: XOR First Block (M₁ ⊕ IV)",
          desc: `M₁ (${toHex(m1)} / ${toBin(m1)}) is XORed with IV (0x00 / 00000000) ➔ X₁ = ${toHex(x1)} (${toBin(x1)}).`,
          active: ['n-iv', 'n-m1', 'w-iv', 'w-m1', 'n-x1'],
          done: []
        },
        {
          title: "Step 2: Encrypt X₁ to produce State C₁",
          desc: `X₁ (${toHex(x1)}) is encrypted with block cipher E using Key K (${toHex(key)}) ➔ State C₁ = ${toHex(c1)}. Note: C₁ is NOT sent over the network; it is only chained forward.`,
          active: ['w-x1-e1', 'w-k1', 'n-e1', 'w-c1'],
          done: ['n-iv', 'n-m1', 'w-iv', 'w-m1', 'n-x1']
        },
        {
          title: "Step 3: Chain C₁ into Block 2 (M₂ ⊕ C₁)",
          desc: `M₂ (${toHex(m2)} / ${toBin(m2)}) is XORed with previous state C₁ (${toHex(c1)} / ${toBin(c1)}) ➔ X₂ = ${toHex(x2)} (${toBin(x2)}).`,
          active: ['n-m2', 'w-m2', 'w-c1', 'n-x2'],
          done: ['n-iv', 'n-m1', 'w-iv', 'w-m1', 'n-x1', 'w-x1-e1', 'w-k1', 'n-e1']
        },
        {
          title: "Step 4: Encrypt X₂ to produce State C₂",
          desc: `X₂ (${toHex(x2)}) is encrypted with block cipher E using Key K (${toHex(key)}) ➔ State C₂ = ${toHex(c2)}. State C₁ is now discarded.`,
          active: ['w-x2-e2', 'w-k2', 'n-e2', 'w-c2'],
          done: ['n-iv', 'n-m1', 'w-iv', 'w-m1', 'n-x1', 'w-x1-e1', 'w-k1', 'n-e1', 'n-m2', 'w-m2', 'w-c1', 'n-x2']
        },
        {
          title: "Step 5: Chain C₂ into Final Block (M₃ ⊕ C₂)",
          desc: `M₃ (${toHex(m3)} / ${toBin(m3)}) is XORed with previous state C₂ (${toHex(c2)} / ${toBin(c2)}) ➔ X₃ = ${toHex(x3)} (${toBin(x3)}).`,
          active: ['n-m3', 'w-m3', 'w-c2', 'n-x3'],
          done: ['n-iv', 'n-m1', 'w-iv', 'w-m1', 'n-x1', 'w-x1-e1', 'w-k1', 'n-e1', 'n-m2', 'w-m2', 'w-c1', 'n-x2', 'w-x2-e2', 'w-k2', 'n-e2']
        },
        {
          title: "Step 6: Final Encryption & Tag Output",
          desc: `X₃ (${toHex(x3)}) is encrypted with Key K (${toHex(key)}) ➔ Final Tag T = ${toHex(c3)}. Every bit of M₁, M₂, and M₃ influenced this final tag!`,
          active: ['w-x3-e3', 'w-k3', 'n-e3', 'w-tag', 'n-tag'],
          done: ['n-iv', 'n-m1', 'w-iv', 'w-m1', 'n-x1', 'w-x1-e1', 'w-k1', 'n-e1', 'n-m2', 'w-m2', 'w-c1', 'n-x2', 'w-x2-e2', 'w-k2', 'n-e2', 'n-m3', 'w-m3', 'w-c2', 'n-x3']
        }
      ];

      const info = stepsInfo[currentStep];
      document.getElementById('step-title').textContent = info.title;
      document.getElementById('step-desc').textContent = info.desc;

      info.active.forEach(id => document.getElementById(id).classList.add('active-elem'));
      info.done.forEach(id => document.getElementById(id).classList.add('done-elem'));
    }

    function nextStep() {
      if (currentStep < totalSteps - 1) {
        currentStep++;
        updateSimulation();
      }
    }

    function prevStep() {
      if (currentStep > 0) {
        currentStep--;
        updateSimulation();
      }
    }

    function resetSim() {
      currentStep = 0;
      updateSimulation();
    }

    document.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('input', () => updateSimulation());
    });

    updateSimulation();
  </script>
</body>
</html>
